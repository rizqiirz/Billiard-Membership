<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="url(#shadowGrad)"/>

  <!-- Bola billiard (putih) -->
  <circle cx="32" cy="30" r="24" fill="url(#ballGrad)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lingkaran angka (hitam) -->
  <circle cx="32" cy="30" r="10.5" fill="#0f172a" opacity="0.9"/>

  <!-- Angka 8 -->
  <text x="32" y="34.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" opacity="0.95">8</text>

  <!-- Kilau (highlight) -->
  <ellipse cx="24" cy="20" rx="7" ry="4.5" fill="#ffffff" opacity="0.65" transform="rotate(-25 24 20)"/>
</svg>

